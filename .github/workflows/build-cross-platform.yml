name: Cross-platform build

on:
  push:
    branches: [jeoitim-modified]
  pull_request:
    branches: [jeoitim-modified]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or existing tag to build
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
      - name: Build and verify Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build dist
          make PRAAT_OS=windows PRAAT_ARCH=x64v1 EXECUTABLE_FILE=build/PraatChineseModified.exe -j4
          python tools/package_platform.py windows build/PraatChineseModified.exe dist/PraatChineseModified
          python tests/chinese/test_portability.py
          dist/PraatChineseModified/PraatChineseModified.exe --utf8 --FULL-TRUST --no-pref-files --pref-dir="$PWD/build/test-prefs" --run tests/chinese/compatibility.praat "$PWD/build/compatibility.txt"
          python tests/chinese/run_script_checks.py dist/PraatChineseModified/PraatChineseModified.exe
          python tests/chinese/run_analysis_regressions.py dist/PraatChineseModified/PraatChineseModified.exe
          python tests/chinese/run_editor_measurements.py dist/PraatChineseModified/PraatChineseModified.exe
          cd dist
          zip -qr PraatChineseModified-Windows-x64.zip PraatChineseModified -x "PraatChineseModified/data/*" "PraatChineseModified/settings/*"
      - uses: actions/upload-artifact@v4
        with:
          name: modified-Windows-x64
          path: dist/PraatChineseModified-Windows-x64.zip
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libgtk-3-dev libasound2-dev libpulse-dev libjack-jackd2-dev libfontconfig1-dev ffmpeg xdg-utils
      - name: Build and verify Linux
        run: |
          set -euo pipefail
          PACKAGE_DIRECTORY=dist/PraatChineseModified JOBS=4 bash build-linux.sh
          python3 tests/chinese/test_portability.py
          python3 tests/chinese/run_script_checks.py dist/PraatChineseModified/PraatChineseModified
          python3 tests/chinese/run_analysis_regressions.py dist/PraatChineseModified/PraatChineseModified
          tar --exclude=PraatChineseModified/data --exclude=PraatChineseModified/settings -C dist -czf dist/PraatChineseModified-Linux-x64.tar.gz PraatChineseModified
      - uses: actions/upload-artifact@v4
        with:
          name: modified-Linux-x64
          path: dist/PraatChineseModified-Linux-x64.tar.gz
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install optional media test dependency
        run: brew install ffmpeg
      - name: Build and verify macOS universal
        run: |
          set -euo pipefail
          PACKAGE_DIRECTORY=dist/PraatChineseModified.app JOBS=4 bash build-macos.sh
          python3 tests/chinese/test_portability.py
          python3 tests/chinese/run_script_checks.py dist/PraatChineseModified.app/Contents/MacOS/PraatChineseModified
          python3 tests/chinese/run_analysis_regressions.py dist/PraatChineseModified.app/Contents/MacOS/PraatChineseModified
          ditto -c -k --sequesterRsrc --keepParent dist/PraatChineseModified.app dist/PraatChineseModified-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: modified-macOS-universal
          path: dist/PraatChineseModified-macOS-universal.zip
