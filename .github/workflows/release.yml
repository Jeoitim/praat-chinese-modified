name: Prepare modified release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing verified tag, such as v7.0.02-jeoitim.1
        required: true
        type: string
      prerelease:
        description: Mark draft as a candidate release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an existing project tag
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-jeoitim\.[0-9]+(-rc\.[0-9]+)?$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
  build:
    needs: verify-tag
    uses: ./.github/workflows/build-cross-platform.yml
    with:
      ref: ${{ inputs.tag_name }}
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: modified-*
          path: dist/releases
          merge-multiple: true
      - name: Create a new draft with complete packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Existing tags and assets will not be overwritten."
            exit 1
          fi
          git archive --format=zip --prefix=PraatChineseModified-source/ --output="dist/releases/PraatChineseModified-source.zip" "$RELEASE_TAG"
          (cd dist/releases && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          args=(release create "$RELEASE_TAG" dist/releases/* --verify-tag --draft --title "Praat 修改版 $RELEASE_TAG")
          notes="docs/release-notes-${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--notes "Windows、Linux 与 macOS 完整资源包。发布前请检查构建记录和已知限制。")
          fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh "${args[@]}"
