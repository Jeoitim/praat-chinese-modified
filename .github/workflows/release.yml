name: Build and release

on:
  push:
    branches:
      - v6.4.62-zh
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Target release tag to append to"
        required: true
        default: "v7.0-zh.4"
        type: string

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc

      - name: Build Praat
        run: |
          cp makefiles/makefile.defs.msys-gcc makefile.defs
          make -j$(nproc)
          strip -s Praat.exe

      - name: Prepare release package
        run: |
          mkdir -p dist
          cp Praat.exe "dist/praat v6.4.62-zh.exe"
          cd dist
          zip -9 "Praat-v6.4.62-zh-Windows-x64.zip" "praat v6.4.62-zh.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praat-v6.4.62-zh-Windows-x64
          path: dist/Praat-v6.4.62-zh-Windows-x64.zip

  build-macos:
    name: Build macOS universal
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode version
        shell: bash
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Prepare Xcode project
        shell: bash
        env:
          PRAAT_UPSTREAM_TAG: "v6.4.62"
          PRAAT_VERSION_DIGITS: "6462"
        run: |
          set -euo pipefail

          if [ -d praat.xcodeproj ]; then
            echo "Using praat.xcodeproj from repository."
          else
            XCODEPROJ_URL="https://github.com/praat/praat/releases/download/${PRAAT_UPSTREAM_TAG}/praat${PRAAT_VERSION_DIGITS}_xcodeproj.zip"
            echo "Downloading Xcode project from $XCODEPROJ_URL"
            curl -fL "$XCODEPROJ_URL" -o praat_xcodeproj.zip
            python3 -c "import zipfile; zipfile.ZipFile('praat_xcodeproj.zip').extractall('.')"
            rm praat_xcodeproj.zip
          fi

          test -d praat.xcodeproj

          mkdir -p praat.xcodeproj/xcshareddata/xcschemes
          cp -f praat.xcodeproj/xcuserdata/*/xcschemes/*.xcscheme praat.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || true

          python3 <<'PY'
          from pathlib import Path

          project_path = Path("praat.xcodeproj/project.pbxproj")
          project = project_path.read_text(encoding="utf-8")

          project = project.replace('DEVELOPMENT_TEAM = J9C6R9XA5W;', 'DEVELOPMENT_TEAM = "";')
          project = project.replace('CODE_SIGN_IDENTITY = "Apple Development";', 'CODE_SIGN_IDENTITY = "-";')
          project = project.replace('"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Development";', '"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";')
          project = project.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          project = project.replace('CODE_SIGN_ENTITLEMENTS = main/Praat.entitlements;', 'CODE_SIGN_ENTITLEMENTS = "";')
          project = project.replace('INFOPLIST_PREFIX_HEADER = /Users/pboersma/Dropbox/Praats/src/sys/praat_version.h;', 'INFOPLIST_PREFIX_HEADER = main/main_Praat.h;')
          project = "\n".join([line for line in project.splitlines() if "repack.cpp" not in line])

          files_to_add = [
              ("sys/praat_translate.cpp", "sys/praat_translate.h", "23E5CB0809A22901004E41D5", "23E5D0BD09A22A57004E41D5", "23E5D0BC09A22A57004E41D5", "01"),
          ]

          for cpp_path, h_path, anchor_grp, anchor_src, anchor_hdr, pfx in files_to_add:
              import os
              cpp_name = os.path.basename(cpp_path)
              h_name = os.path.basename(h_path)
              if cpp_name in project:
                  print(f"{cpp_name} is already present in the Xcode project.")
                  continue

              file_ref_cpp = f"CDFE000000000000000000{pfx}1"
              build_file_cpp = f"CDFE000000000000000000{pfx}2"
              header_ref = f"CDFE000000000000000000{pfx}3"
              header_build = f"CDFE000000000000000000{pfx}4"

              project = project.replace(
                  "/* Begin PBXBuildFile section */\n",
                  "/* Begin PBXBuildFile section */\n"
                  f"\t\t{build_file_cpp} /* {cpp_name} in Sources */ = "
                  f"{{isa = PBXBuildFile; fileRef = {file_ref_cpp} /* {cpp_name} */; }};\n"
                  f"\t\t{header_build} /* {h_name} in Headers */ = "
                  f"{{isa = PBXBuildFile; fileRef = {header_ref} /* {h_name} */; }};\n",
                  1,
              )
              project = project.replace(
                  "/* Begin PBXFileReference section */\n",
                  "/* Begin PBXFileReference section */\n"
                  f"\t\t{file_ref_cpp} /* {cpp_name} */ = "
                  f"{{isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = sourcecode.cpp.objcpp; "
                  f"name = {cpp_name}; path = {cpp_path}; sourceTree = \"<group>\"; }};\n"
                  f"\t\t{header_ref} /* {h_name} */ = "
                  f"{{isa = PBXFileReference; fileEncoding = 4; lastKnownFileType = sourcecode.c.h; "
                  f"name = {h_name}; path = {h_path}; sourceTree = \"<group>\"; }};\n",
                  1,
              )

              # Group anchor
              grp_anchor = f"\t\t\t\t{anchor_grp} /*"
              idx = project.find(grp_anchor)
              if idx != -1:
                  end_line = project.find("\n", idx) + 1
                  project = project[:end_line] + f"\t\t\t\t{file_ref_cpp} /* {cpp_name} */,\n\t\t\t\t{header_ref} /* {h_name} */,\n" + project[end_line:]

              # Sources anchor
              src_anchor = f"\t\t\t\t{anchor_src} /*"
              idx = project.find(src_anchor)
              if idx != -1:
                  end_line = project.find("\n", idx) + 1
                  project = project[:end_line] + f"\t\t\t\t{build_file_cpp} /* {cpp_name} in Sources */,\n" + project[end_line:]

              # Headers anchor
              hdr_anchor = f"\t\t\t\t{anchor_hdr} /*"
              idx = project.find(hdr_anchor)
              if idx != -1:
                  end_line = project.find("\n", idx) + 1
                  project = project[:end_line] + f"\t\t\t\t{header_build} /* {h_name} in Headers */,\n" + project[end_line:]

              print(f"Added {cpp_path} and {h_path} to praat_mac Xcode target.")

          project_path.write_text(project, encoding="utf-8")
          print("All missing files patched into Xcode project successfully.")
          PY

      - name: Build Praat.app
        shell: bash
        run: |
          set -euo pipefail

          touch external/whispercpp/repack.cpp

          xcodebuild \
            -project praat.xcodeproj \
            -target praat_mac \
            -configuration Configuration64 \
            SYMROOT="$PWD/build/macos/products" \
            OBJROOT="$PWD/build/macos/intermediates" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          APP_PATH="$(find build/macos -type d -name Praat.app -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Praat.app was not produced by the Xcode build."
            find build/macos -maxdepth 4 -print || true
            exit 1
          fi

          PACKAGE_NAME="Praat-v6.4.62-zh-macOS-universal.dmg"
          hdiutil create -fs HFS+ -ov -srcfolder "$APP_PATH" -volname "Praat v6.4.62-zh" "dist/${PACKAGE_NAME%.dmg}.tmp.dmg"
          hdiutil convert -ov -format UDZO -o "dist/$PACKAGE_NAME" "dist/${PACKAGE_NAME%.dmg}.tmp.dmg"
          rm "dist/${PACKAGE_NAME%.dmg}.tmp.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Praat-v6.4.62-zh-macOS-universal
          path: dist/Praat-v6.4.62-zh-macOS-universal.dmg

  append-release:
    name: Append assets to release
    runs-on: ubuntu-latest
    needs:
      - build-windows-x64
      - build-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Append to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.target_tag || 'v7.0-zh.4' }}
        run: |
          python3 - <<'PY'
          import os, glob, subprocess

          gh_repo = os.environ["GH_REPO"]
          target_tag = os.environ.get("TARGET_TAG", "v7.0-zh.4")

          # 1. Verify release exists
          view_res = subprocess.run(["gh", "release", "view", target_tag, "--repo", gh_repo, "--json", "body", "-q", ".body"], capture_output=True, text=True)
          if view_res.returncode != 0:
              print(f"Error: Target release {target_tag} does not exist.")
              exit(1)

          current_notes = view_res.stdout

          # 2. Upload only the new v6.4.62 assets without touching v7.0 assets
          files = sorted(glob.glob("dist/Praat-v6.4.62-zh-*"))
          print("Files to upload:", files)
          if not files:
              print("Error: No v6.4.62 build artifacts found to upload.")
              exit(1)

          subprocess.run(["gh", "release", "upload", target_tag, *files, "--repo", gh_repo, "--clobber"], check=True)
          print("Assets uploaded successfully.")

          # 3. Append v6.4.62 section to release notes if not already present
          if "Praat 6.4.62" not in current_notes:
              extra_notes = (
                  "\n\n---\n\n"
                  "### Praat 6.4.62 经典轻量中文版\n"
                  "追求原生极致轻量（单文件自包含经典 Motif 界面，无需外部 Whisper 模型，压缩包仅 23MB）：\n"
                  "- **Windows x64**: `Praat-v6.4.62-zh-Windows-x64.zip`\n"
                  "- **macOS Universal**: `Praat-v6.4.62-zh-macOS-universal.dmg`\n"
              )
              new_notes = current_notes.strip() + extra_notes
              subprocess.run(["gh", "release", "edit", target_tag, "--repo", gh_repo, "--notes", new_notes], check=True)
              print("Release notes appended successfully.")
          else:
              print("Praat 6.4.62 section already present in release notes.")
          PY
